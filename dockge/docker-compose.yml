services:
  dockge:
    image: louislam/dockge:1
    restart: unless-stopped
    ports:
      - 5001:5001
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - /home/jae:/home/jae
    environment:
      - DOCKGE_STACKS_DIR=/home/jae
    networks:
      - caddy_network

networks:
  caddy_network:
    external: true
